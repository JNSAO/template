name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write

    steps:
      - if: github.event_name == 'workflow_dispatch'
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - if: github.event_name == 'push'
        run: echo "TAG_NAME=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4.4.0
        with:
          package_file: .github/tlpackages

      - name: Build documentation
        run: |
          latexmk -pdflatex jnsao_template
          latexmk -c

      - name: Package
        run: zip -j9 jnsao.zip 00README.json jnsao.* jnsao_template.*

      - name: Generate attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: jnsao.zip

      - name: Create release
        run: gh release create ${{ env.TAG_NAME }} jnsao.zip
        env:
          GH_TOKEN: ${{ github.token }}
